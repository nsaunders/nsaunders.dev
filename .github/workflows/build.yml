name: build

on:
  push:
    branches:
      - latest
      - next
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      APP_URL:
        ${{ (github.base_ref || github.ref_name) == 'next' &&
        'https://next.nsaunders.dev' || 'https://nsaunders.dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - run: npm run build
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - if: >-
          github.event_name != 'pull_request' && (github.ref ==
          'refs/heads/latest' || github.ref == 'refs/heads/next')
        name: cloudflare deployment
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: 4.124.0
          apiToken: ${{ secrets.CF_TOKEN }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          command: >-
            pages deploy build/client --project-name=nsaunders --branch=${{
            github.ref_name }}
